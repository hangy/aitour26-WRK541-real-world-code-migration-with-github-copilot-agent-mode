[package]
name = "weather-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.9"
actix-files = "0.6"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For global static data
once_cell = "1.20"

# OpenAPI documentation
utoipa = { version = "4.2", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "7.1", features = ["actix-web"] }

[dev-dependencies]
# Testing
actix-rt = "2.10"
reqwest = { version = "0.12", features = ["json"] }
