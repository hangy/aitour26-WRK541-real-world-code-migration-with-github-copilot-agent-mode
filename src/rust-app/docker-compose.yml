version: '3.8'

services:
  weather-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-api:latest
    container_name: weather-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/countries"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
